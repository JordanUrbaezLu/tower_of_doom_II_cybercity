<title>Fallen Cybercity Art Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
@font-face { font-family: "TOD Tower"; src: url(data:font/ttf;base64,/*__FONT__*/) format("truetype"); font-display: block; }
:root {
  color-scheme: dark;
  --ground: #090d1b;
  --panel: #10172f;
  --panel-2: #151e3c;
  --line: #24305a;
  --ink: #e6ebf7;
  --muted: #8b97bd;
  --faint: #5d6890;
  --cyan: #3fd8e8;
  --gold: #f5c542;
  --red: #f0524b;
  --violet: #9b8cf2;
  --tile: 150px;
  --display: "TOD Tower", "Barlow", system-ui, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font: 15px/1.45 var(--body); margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 28px;
  padding-block: 18px 14px; padding-inline: 20px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #0e1531 0%, var(--ground) 100%); }
.mark { display: flex; flex-direction: column; gap: 2px; }
.mark .t1 { font: 30px/1 var(--display); letter-spacing: .02em; color: var(--ink); text-shadow: 0 0 18px rgba(63, 216, 232, .25); }
.mark .t2 { font: 15px/1 var(--display); letter-spacing: .16em; color: var(--cyan); }
.stamp { color: var(--muted); font-size: 13px; }
.stamp b { color: var(--ink); font-weight: 600; }
.statusbar { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); cursor: pointer; font-size: 13px; color: var(--muted); }
.pill .n { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; }
.pill[aria-pressed="true"] { border-color: var(--cyan); color: var(--ink); background: var(--panel-2); }
.dot.game { background: var(--cyan); } .dot.stock { background: var(--violet); } .dot.disk { background: var(--faint); } .dot.prod { background: var(--gold); }

nav.cats { border-right: 1px solid var(--line); padding-block: 14px; padding-inline: 12px; position: sticky; top: env(safe-area-inset-top, 0px);
  align-self: start; max-height: 100vh; overflow-y: auto; }
.cat { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border: 0;
  background: none; border-radius: 6px; cursor: pointer; text-align: left; color: var(--muted); }
.cat:hover { background: var(--panel); color: var(--ink); }
.cat[aria-current="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--cyan); }
.cat .lbl { font: 13px/1.2 var(--display); letter-spacing: .05em; }
.cat .n { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--faint); }
.cat.special .lbl { color: var(--gold); }
.navsep { height: 1px; background: var(--line); margin: 8px 4px; }

main { min-width: 0; padding-block: 14px 40px; padding-inline: 20px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 11px; }
.search input { flex: 1; background: none; border: 0; outline: none; min-width: 0; font-family: var(--mono); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel); border: 0; padding: 6px 11px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--cyan); }
.ctl { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.ctl input[type=range] { width: 110px; accent-color: var(--cyan); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; }

.section-head { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 12px; }
.section-head h2 { font: 20px/1.1 var(--display); letter-spacing: .04em; margin: 0; text-wrap: balance; }
.section-head .meta { color: var(--muted); font-size: 13px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 8px; border: 1px solid transparent;
  background: var(--panel); cursor: pointer; text-align: left; min-width: 0; content-visibility: auto; contain-intrinsic-size: auto 200px; }
.tile:hover { border-color: var(--line); background: var(--panel-2); }
.frame { position: relative; height: var(--tile); border-radius: 5px; display: grid; place-items: center; overflow: hidden; }
.bg-dark .frame, .bg-dark .stage { background: #05070f; }
.bg-light .frame, .bg-light .stage { background: #d8dce8; }
.bg-check .frame, .bg-check .stage { background: repeating-conic-gradient(#1c2340 0 25%, #121831 0 50%) 0 0 / 16px 16px; }
.spr { background-repeat: no-repeat; flex: none; }
.tile .nm { font: 12px/1.3 var(--mono); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .sub { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { position: absolute; top: 6px; left: 6px; font: 600 10px/1 var(--body); letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 6px; border-radius: 4px; background: rgba(9, 13, 27, .85); }
.chip.prod { color: var(--gold); } .chip.disk { color: var(--muted); } .chip.stock { color: var(--violet); } .chip.err { color: var(--red); }
.nosrc { color: var(--faint); font: 11px/1.3 var(--mono); text-align: center; padding: 10px; }
.empty { color: var(--muted); padding: 40px 0; }

.log { display: grid; gap: 14px; max-width: 1100px; }
.logrow { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.logrow h3 { margin: 0 0 6px; font: 15px/1.2 var(--display); letter-spacing: .05em; }
.logrow .sum { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.logrow .sum b { font-variant-numeric: tabular-nums; }
.logstrip { display: flex; flex-wrap: wrap; gap: 6px; }
.mini { border: 1px solid var(--line); background: #05070f; border-radius: 5px; width: 64px; height: 64px; display: grid; place-items: center;
  cursor: pointer; overflow: hidden; padding: 0; }
.tag { font: 600 11px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; }
.tag.add { color: var(--cyan); } .tag.chg { color: var(--gold); } .tag.rem { color: var(--red); }

dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0;
  width: min(1180px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(3, 5, 12, .78); }
.lb { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 0; }
.stage { display: grid; place-items: center; min-height: 420px; padding: 18px; position: relative; }
.info { border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; max-height: calc(100vh - 34px); }
.info h3 { margin: 0; font: 500 14px/1.35 var(--mono); word-break: break-all; }
.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 5px 10px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; font-variant-numeric: tabular-nums; }
.kv code, .refs code { font: 12px/1.35 var(--mono); }
.refs { display: flex; flex-direction: column; gap: 3px; }
.refs .h { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--cyan); }
.navbtn { position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 54px; border-radius: 8px; border: 1px solid var(--line);
  background: rgba(16, 23, 47, .85); cursor: pointer; font-size: 20px; }
.navbtn.prev { left: 10px; } .navbtn.next { right: 10px; }
.foot { color: var(--faint); font-size: 12px; margin-top: 26px; }
.foot code { font-family: var(--mono); }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.cats { position: static; max-height: none; display: flex; gap: 6px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line);
    padding-inline: 16px; }
  .cat { width: auto; white-space: nowrap; flex: none; }
  .navsep { display: none; }
  main, header.top { padding-inline: 16px; }
  .statusbar { margin-left: 0; }
  .lb { grid-template-columns: minmax(0, 1fr); }
  .info { border-left: 0; border-top: 1px solid var(--line); max-height: none; }
  .stage { min-height: 280px; }
}
@media (prefers-reduced-motion: no-preference) { .tile { transition: background-color .12s, border-color .12s; } }
</style>

<div class="shell bg-dark" id="shell">
  <header class="top">
    <div class="mark"><span class="t1">TOWER OF DOOM II</span><span class="t2">ART ATLAS</span></div>
    <div class="stamp" id="stamp"></div>
    <div class="statusbar" id="statusbar" role="group" aria-label="Show"></div>
  </header>
  <nav class="cats" id="cats" aria-label="Categories"></nav>
  <main>
    <div class="toolbar">
      <label class="search"><span aria-hidden="true" style="color:var(--faint)">&#9906;</span>
        <input id="q" type="search" placeholder="Search asset names, e.g. card2, cloak, pause_r" autocomplete="off"></label>
      <div class="ctl">Sort <select id="sort"><option value="name">Name</option><option value="recent">Recently changed</option><option value="size">Pixel size</option></select></div>
      <div class="seg" role="group" aria-label="Background" id="bgseg">
        <button data-bg="dark" aria-pressed="true">Dark</button><button data-bg="check" aria-pressed="false">Checker</button><button data-bg="light" aria-pressed="false">Light</button>
      </div>
      <label class="ctl" for="size">Tiles <input id="size" type="range" min="96" max="260" step="4" value="150"></label>
    </div>
    <div class="section-head"><h2 id="title"></h2><span class="meta" id="count"></span></div>
    <div id="view"></div>
    <p class="foot">Regenerated by <code>python tools/art_gallery/build_gallery.py</code> after every art change, then republished to this same link. Thumbnails are scaled; the detail view shows a larger preview and the true pixel size.</p>
  </main>
</div>

<dialog id="lb" aria-label="Image details">
  <div class="lb">
    <div class="stage" id="stage">
      <button class="navbtn prev" id="prev" aria-label="Previous image">&#8249;</button>
      <div id="big"></div>
      <button class="navbtn next" id="next" aria-label="Next image">&#8250;</button>
    </div>
    <div class="info" id="info"></div>
  </div>
</dialog>

<script>
const DATA = /*__MANIFEST__*/null;
const STATUS = { game: 'In game', stock: 'Stock / kit', disk: 'Not in game', prod: 'In production' };
const store = { get(k, d) { try { const v = localStorage.getItem('tod_atlas_' + k); return v === null ? d : v; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('tod_atlas_' + k, v); } catch (e) {} } };
const byKey = new Map(DATA.items.map(it => [it.k, it]));
let state = { status: store.get('status', 'game'), cat: 'All', q: '', sort: store.get('sort', 'name'), bg: store.get('bg', 'dark'),
              tile: +store.get('tile', 150) };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const statusOk = it => state.status === 'all' || it.s === state.status;

function sprite(it, box, maxScale, preferPreview) {
  const pv = preferPreview && it.pv;
  const pl = pv ? it.pv : it.t;
  if (!pl) return `<div class="nosrc">${it.err ? 'unreadable source' : 'no source in repo'}<br>${esc(it.n)}</div>`;
  const sheet = DATA.atlases[pv ? 'p' : 't'][pl[0]];
  const [, x, y, w, h] = pl;
  const s = Math.min(box[0] / w, box[1] / h, maxScale);
  return `<div class="spr" style="width:${(w * s).toFixed(1)}px;height:${(h * s).toFixed(1)}px;background-image:url('${sheet[0]}');` +
    `background-size:${(sheet[1] * s).toFixed(1)}px ${(sheet[2] * s).toFixed(1)}px;background-position:${(-x * s).toFixed(1)}px ${(-y * s).toFixed(1)}px"></div>`;
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  let items = DATA.items.filter(it => statusOk(it) && (state.cat === 'All' || it.c === state.cat) &&
    (!q || it.n.toLowerCase().includes(q) || (it.pk || '').includes(q)));
  if (state.sort === 'recent') items = items.slice().sort((a, b) => (b.m || '').localeCompare(a.m || '') || a.n.localeCompare(b.n));
  else if (state.sort === 'size') items = items.slice().sort((a, b) => ((b.w || 0) * (b.h || 0)) - ((a.w || 0) * (a.h || 0)));
  return items;
}

function renderStatus() {
  const c = DATA.counts;
  const opts = [['game', c.game || 0], ['stock', c.stock || 0], ['disk', c.disk || 0], ['prod', c.prod || 0], ['all', DATA.items.length]];
  $('statusbar').innerHTML = opts.filter(([k, n]) => k === 'all' || n > 0 || k === 'prod').map(([k, n]) =>
    `<button class="pill" data-status="${k}" aria-pressed="${state.status === k}">${k === 'all' ? '' : `<span class="dot ${k}"></span>`}${k === 'all' ? 'Everything' : STATUS[k]} <span class="n">${n}</span></button>`).join('');
}

function renderCats() {
  const counts = {};
  DATA.items.forEach(it => { if (statusOk(it)) counts[it.c] = (counts[it.c] || 0) + 1; });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const logN = DATA.log.length;
  let html = `<button class="cat special" data-cat="__log" aria-current="${state.cat === '__log'}"><span class="lbl">CHANGE LOG</span><span class="n">${logN}</span></button><div class="navsep"></div>`;
  html += `<button class="cat" data-cat="All" aria-current="${state.cat === 'All'}"><span class="lbl">ALL</span><span class="n">${total}</span></button>`;
  DATA.cats.forEach(c => { if (counts[c]) html += `<button class="cat" data-cat="${esc(c)}" aria-current="${state.cat === c}"><span class="lbl">${esc(c.toUpperCase())}</span><span class="n">${counts[c]}</span></button>`; });
  $('cats').innerHTML = html;
}

function tileHtml(it) {
  const box = [state.tile, state.tile];
  const chip = it.err ? '<span class="chip err">unreadable</span>' : (it.s !== 'game' ? `<span class="chip ${it.s}">${it.s === 'prod' ? 'in production' : STATUS[it.s]}</span>` : '');
  return `<button class="tile" data-k="${esc(it.k)}" title="${esc(it.n)}"><div class="frame">${chip}${sprite(it, box, 2, false)}</div>` +
    `<span class="nm">${esc(it.n)}</span><span class="sub"><span>${it.w ? it.w + '×' + it.h : '—'}</span><span>${it.pk ? esc(it.pk) : (it.m || '').slice(0, 10)}</span></span></button>`;
}

let current = [];
function renderView() {
  document.documentElement.style.setProperty('--tile', state.tile + 'px');
  if (state.cat === '__log') return renderLog();
  current = filtered();
  $('title').textContent = state.cat === 'All' ? 'All images' : state.cat;
  $('count').textContent = `${current.length} image${current.length === 1 ? '' : 's'} · ${state.status === 'all' ? 'every status' : STATUS[state.status].toLowerCase()}`;
  $('view').innerHTML = current.length ? `<div class="grid">${current.map(tileHtml).join('')}</div>` :
    `<p class="empty">Nothing here for this filter. Try <b>Everything</b> above, or clear the search.</p>`;
}

function renderLog() {
  current = [];
  $('title').textContent = 'Change log';
  $('count').textContent = `${DATA.log.length} rebuild${DATA.log.length === 1 ? '' : 's'} recorded`;
  const mini = k => { const it = byKey.get(k); if (!it) return `<span class="mini" title="${esc(k)}"></span>`;
    return `<button class="mini" data-k="${esc(k)}" title="${esc(it.n)}">${sprite(it, [58, 58], 1, false)}</button>`; };
  const rows = DATA.log.map(e => {
    if (e.first) return `<div class="logrow"><h3>${esc(e.at)} · ATLAS STARTED</h3><div class="sum">First build: <b>${e.total}</b> images catalogued. Later rebuilds list what was added, changed or removed.</div></div>`;
    const sec = (lbl, cls, arr) => arr.length ? `<div class="sum"><span class="tag ${cls}">${lbl}</span> <b>${arr.length}</b></div><div class="logstrip">${arr.slice(0, 60).map(mini).join('')}${arr.length > 60 ? `<span class="sum">+${arr.length - 60} more</span>` : ''}</div>` : '';
    return `<div class="logrow"><h3>${esc(e.at)}</h3>${sec('Added', 'add', e.added)}${sec('Changed', 'chg', e.changed)}${sec('Removed', 'rem', e.removed)}</div>`;
  }).join('');
  $('view').innerHTML = `<div class="log">${rows}</div>`;
}

let lbIndex = -1, lbList = [];
function openLb(k, list) {
  lbList = list && list.length ? list : [byKey.get(k)];
  lbIndex = Math.max(0, lbList.findIndex(it => it.k === k));
  drawLb();
  const d = $('lb'); if (!d.open) d.showModal();
}
function drawLb() {
  const it = lbList[lbIndex]; if (!it) return;
  const wide = window.innerWidth > 860;
  const box = [wide ? Math.min(780, window.innerWidth - 420) : window.innerWidth - 70, Math.min(720, window.innerHeight * (wide ? .78 : .45))];
  $('big').innerHTML = sprite(it, box, it.pv ? 1.25 : 3, true);
  $('prev').hidden = $('next').hidden = lbList.length < 2;
  const refs = (it.r || []).map(r => `<code>${esc(r)}</code>`).join('') || '<span style="color:var(--faint)">No code names it literally.</span>';
  const briefs = (it.b || []).map(r => `<code>${esc(r)}</code>`).join('');
  $('info').innerHTML = `<h3>${esc(it.n)}</h3>
    <div class="btnrow"><button class="btn" id="copy">Copy name</button><button class="btn" id="close">Close</button></div>
    <dl class="kv">
      <dt>Status</dt><dd><span class="dot ${it.s}" style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px"></span>${STATUS[it.s]}${it.pk ? ' · pack ' + esc(it.pk) : ''}</dd>
      <dt>Category</dt><dd>${esc(it.c)}</dd>
      <dt>Pixels</dt><dd>${it.w ? it.w + ' × ' + it.h : '—'}${it.w && (it.w % 4 || it.h % 4) ? ' <span style="color:var(--red)">(not a multiple of 4)</span>' : ''}</dd>
      <dt>File</dt><dd>${it.kb ? it.kb + ' KB' : '—'}</dd>
      <dt>Changed</dt><dd>${esc(it.m || '—')}</dd>
      <dt>Compression</dt><dd>${esc(it.cm || '—')}</dd>
      <dt>GDT</dt><dd>${it.g ? `<code>${esc(it.g)}</code>` : '—'}</dd>
      <dt>Zone</dt><dd>${it.z ? `<code>${esc(it.z)}</code>` : 'not zoned'}</dd>
      <dt>Source</dt><dd>${it.p ? `<code>${esc(it.p)}</code>` : '—'}</dd>
      <dt>md5</dt><dd><code>${esc((it.md5 || '').slice(0, 12))}</code></dd>
    </dl>
    <div class="refs"><span class="h">${it.fam ? 'Named at runtime from ' + esc(it.fam) + '… in' : 'Named in'}</span>${refs}</div>
    ${briefs ? `<div class="refs"><span class="h">Briefs</span>${briefs}</div>` : ''}`;
  $('close').onclick = () => $('lb').close();
  $('copy').onclick = e => { const b = e.currentTarget;
    Promise.resolve().then(() => navigator.clipboard.writeText(it.n)).then(() => { b.textContent = 'Copied'; }, () => { b.textContent = 'Select the name above'; }); };
}
function step(d) { if (lbList.length < 2) return; lbIndex = (lbIndex + d + lbList.length) % lbList.length; drawLb(); }

function setBg(bg) { state.bg = bg; store.set('bg', bg);
  $('shell').className = 'shell bg-' + bg; $('lb').className = 'bg-' + bg;
  document.querySelectorAll('#bgseg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.bg === bg)); }

function boot() {
  if (state.status !== 'all' && !(DATA.counts[state.status] > 0)) state.status = 'game';
  $('stamp').innerHTML = `Updated <b>${esc(DATA.built)}</b> · ${DATA.items.length} images · Map 2 only: art the map actually uses, plus new art in production`;
  const hash = decodeURIComponent((location.hash || '').slice(1));
  if (hash === 'log') state.cat = '__log';
  $('sort').value = state.sort; $('size').value = state.tile; setBg(state.bg);
  renderStatus(); renderCats(); renderView();
  $('statusbar').addEventListener('click', e => { const b = e.target.closest('[data-status]'); if (!b) return;
    state.status = b.dataset.status; store.set('status', state.status); if (state.cat === '__log') state.cat = 'All';
    renderStatus(); renderCats(); renderView(); });
  $('cats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return;
    state.cat = b.dataset.cat; renderCats(); renderView(); window.scrollTo({ top: 0 }); });
  $('q').addEventListener('input', e => { state.q = e.target.value; if (state.cat === '__log') { state.cat = 'All'; renderCats(); } renderView(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; store.set('sort', state.sort); renderView(); });
  $('size').addEventListener('input', e => { state.tile = +e.target.value; store.set('tile', state.tile); renderView(); });
  $('bgseg').addEventListener('click', e => { const b = e.target.closest('[data-bg]'); if (b) setBg(b.dataset.bg); });
  $('view').addEventListener('click', e => { const t = e.target.closest('[data-k]'); if (!t) return;
    openLb(t.dataset.k, state.cat === '__log' ? null : current); });
  $('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
  $('lb').addEventListener('click', e => { if (e.target === $('lb')) $('lb').close(); });
  document.addEventListener('keydown', e => { if (!$('lb').open) return;
    if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); });
}
boot();
</script>
